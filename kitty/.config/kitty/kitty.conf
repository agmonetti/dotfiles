# ==========================================
# KITTY CONFIG - MINIMAL BLACK PRO (FINAL)
# ==========================================

# --- FUENTES ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13
disable_ligatures never

# --- APARIENCIA ---
background_opacity 1.0

# --- TEMA ACTIVO (symlink alternado por kitty-theme-toggle.sh) ---
include themes/active.conf

# Cursor estilo IDE (limpio)
cursor_shape beam
cursor_blink_interval 0

# UI limpia
hide_window_decorations yes
window_padding_width 12 14

# --- TABS (visibles solo cuando tiene sentido) ---
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2

# --- SCROLL ---
scrollback_lines 10000

# --- COMPORTAMIENTO ---
shell zsh
enable_audio_bell no
copy_on_select yes
allow_remote_control yes
shell_integration enabled

# --- PERFORMANCE ---
repaint_delay 10
input_delay 3
sync_to_monitor yes

# --- NAVEGACIÓN TIPO "BLOQUES" ---
map ctrl+shift+up scroll_to_prompt -1
map ctrl+shift+down scroll_to_prompt 1
map ctrl+shift+page_up scroll_to_prompt -1
map ctrl+shift+page_down scroll_to_prompt 1
map ctrl+shift+z scroll_to_prompt 0
map ctrl+ñ launch --location=hsplit --cwd=current
map alt+left neighboring_window left
map alt+right neighboring_window right

# --- TOGGLE DE TEMA (oscuro <-> claro) ---
map ctrl+shift+t launch --type=overlay ${HOME}/Documentos/dotfiles/scripts/kitty-theme-toggle.sh
