# ==========================================
# KITTY CONFIG - MINIMAL BLACK PRO (FINAL)
# ==========================================

# --- FUENTES ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13
disable_ligatures never

# --- APARIENCIA ---
background_opacity 1.0
background #000000
foreground #cdd6f4

# Cursor estilo IDE (limpio)
cursor #f5e0dc
cursor_text_color #000000
cursor_shape beam
cursor_blink_interval 0

selection_background #313244
selection_foreground #cdd6f4

# UI limpia
hide_window_decorations yes
window_padding_width 12 14

# --- TABS (visibles solo cuando tiene sentido) ---
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2

# --- COLORES ANSI (balanceados) ---
color0  #1e1e2e
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de

color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

# --- SCROLL ---
scrollback_lines 10000

# --- COMPORTAMIENTO ---
shell zsh
enable_audio_bell no
copy_on_select yes
allow_remote_control yes
shell_integration enabled

# --- PERFORMANCE ---
repaint_delay 10
input_delay 3
sync_to_monitor yes

# --- NAVEGACIÓN TIPO "BLOQUES" ---
map ctrl+shift+up scroll_to_prompt -1
map ctrl+shift+down scroll_to_prompt 1
map ctrl+shift+page_up scroll_to_prompt -1
map ctrl+shift+page_down scroll_to_prompt 1
map ctrl+shift+z scroll_to_prompt 0
map ctrl+ñ launch --location=hsplit --cwd=current
map alt+left neighboring_window left
map alt+right neighboring_window right
