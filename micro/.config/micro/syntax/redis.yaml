filetype: redis

detect:
    filename: "(\\.(redis|rediscli|redis-cli|acl)$)"
    header: "^(#.*redis|#!.*/(env +)?redis-cli)"

rules:
    # Key-Value, Strings & Generic Commands
    - statement: "(?i)\\b(GET|SET|SETNX|SETEX|PSETEX|MGET|MSET|MSETNX|GETSET|GETDEL|GETEX|GETRANGE|SETRANGE|STRLEN|APPEND|INCR|DECR|INCRBY|DECRBY|INCRBYFLOAT)\\b"
    - statement: "(?i)\\b(DEL|UNLINK|EXISTS|EXPIRE|EXPIREAT|PEXPIRE|PEXPIREAT|EXPIRETIME|PEXPIRETIME|TTL|PTTL|PERSIST|KEYS|SCAN|TYPE|RENAME|RENAMENX|COPY|MOVE|DUMP|RESTORE|OBJECT|TOUCH|SORT|RANDOMKEY|WAIT|WAITAOF)\\b"

    # Hashes, Lists, Sets & Sorted Sets
    - statement: "(?i)\\b(HGET|HSET|HSETNX|HMGET|HMSET|HDEL|HEXISTS|HGETALL|HKEYS|HVALS|HLEN|HINCRBY|HINCRBYFLOAT|HSCAN|HRANDFIELD|HSTRLEN)\\b"
    - statement: "(?i)\\b(LPUSH|LPUSHX|RPUSH|RPUSHX|LPOP|RPOP|RPOPLPUSH|LMOVE|BLPOP|BRPOP|BRPOPLPUSH|BLMOVE|LLEN|LRANGE|LINDEX|LINSERT|LSET|LREM|LTRIM|LPOS)\\b"
    - statement: "(?i)\\b(SADD|SREM|SPOP|SRANDMEMBER|SMEMBERS|SISMEMBER|SMISMEMBER|SCARD|SDIFF|SDIFFSTORE|SINTER|SINTERSTORE|SINTERCARD|SUNION|SUNIONSTORE|SMOVE|SSCAN)\\b"
    - statement: "(?i)\\b(ZADD|ZREM|ZINCRBY|ZRANGE|ZREVRANGE|ZRANGEBYSCORE|ZREVRANGEBYSCORE|ZRANK|ZREVRANK|ZSCORE|ZMSCORE|ZCARD|ZCOUNT|ZLEXCOUNT|ZPOPMIN|ZPOPMAX|BZPOPMIN|BZPOPMAX|ZREMRANGEBYRANK|ZREMRANGEBYSCORE|ZREMRANGEBYLEX|ZUNION|ZUNIONSTORE|ZINTER|ZINTERSTORE|ZDIFF|ZDIFFSTORE|ZSCAN|ZRANDMEMBER|ZRANGESTORE)\\b"

    # Streams, Geospatial, HyperLogLog & Bitmaps
    - statement: "(?i)\\b(XADD|XREAD|XREADGROUP|XRANGE|XREVRANGE|XLEN|XDEL|XTRIM|XGROUP|XACK|XCLAIM|XAUTOCLAIM|XPENDING|XINFO)\\b"
    - statement: "(?i)\\b(GEOADD|GEODIST|GEOHASH|GEOPOS|GEORADIUS|GEORADIUSBYMEMBER|GEOSEARCH|GEOSEARCHSTORE)\\b"
    - statement: "(?i)\\b(PFADD|PFCOUNT|PFMERGE|SETBIT|GETBIT|BITCOUNT|BITPOS|BITOP|BITFIELD)\\b"

    # Pub/Sub, Transactions, Scripting & Admin
    - statement: "(?i)\\b(PUBLISH|SUBSCRIBE|UNSUBSCRIBE|PSUBSCRIBE|PUNSUBSCRIBE|SPUBLISH|SSUBSCRIBE|SUNSUBSCRIBE|PUBSUB)\\b"
    - statement: "(?i)\\b(MULTI|EXEC|DISCARD|WATCH|UNWATCH|EVAL|EVALSHA|EVAL_RO|EVALSHA_RO|SCRIPT|FCALL|FCALL_RO|FUNCTION)\\b"
    - statement: "(?i)\\b(PING|ECHO|AUTH|SELECT|FLUSHDB|FLUSHALL|DBSIZE|INFO|CONFIG|CLIENT|SLOWLOG|TIME|SAVE|BGSAVE|BGREWRITEAOF|SHUTDOWN|MONITOR|COMMAND|ROLE|CLUSTER|READONLY|READWRITE|SWAPDB|MEMORY)\\b"
    - statement: "(?i)\\b(ACL|SETUSER|GETUSER|DELUSER|LIST|USERS|WHOAMI|CAT|GENPASS|LOG|LOAD|DRYRUN)\\b"

    # Command Options & Flags
    - special: "(?i)\\b(NX|XX|EX|PX|EXAT|PXAT|KEEPTTL|GET|CH|INCR|BEFORE|AFTER|LEFT|RIGHT|WITHSCORES|LIMIT|MATCH|COUNT|TYPE|BLOCK|STREAMS|CREATE|SETID|DESTROY|DELCONSUMER|CREATECONSUMER|RESET|ALLKEYS|RESETSTAT|REWRITE|RESETKEYS|SETNAME|GETNAME|KILL|PAUSE|UNPAUSE|ID|ADDR|SKIPME|YES|NO|ASYNC|SYNC|FORCE|NOMKSTREAM|MINID|MAXLEN)\\b"

    # Standard Responses & Constants
    - constant.bool: "(?i)\\b(OK|PONG|QUEUED|true|false)\\b"
    - constant: "(?i)\\b(nil|null|none|TRYAGAIN|MOVED|ASK|CLUSTERDOWN|CROSSSLOT|MASTERDOWN|LOADING|BUSYGROUP|NOSCRIPT)\\b"
    - constant.number: "\\b[-+]?[0-9]+(\\.[0-9]+)?\\b"

    # Strings
    - constant.string:
        start: "\""
        end: "\""
        skip: "\\\\."
        rules:
            - constant.specialChar: "\\\\."

    - constant.string:
        start: "'"
        end: "'"
        skip: "\\\\."
        rules:
            - constant.specialChar: "\\\\."

    # Comments
    - comment:
        start: "#"
        end: "$"
        rules:
            - todo: "(TODO|XXX|FIXME)"

    - comment:
        start: "//"
        end: "$"
        rules:
            - todo: "(TODO|XXX|FIXME)"
